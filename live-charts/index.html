            --font-mono: 'Space Grotesk', monospace;
            
            --ease-cinematic: cubic-bezier(0.165, 0.84, 0.44, 1);

        /* --- 2. GLOBAL RESET & FULL-WIDTH FIX --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: var(--lc-bg-base);
            color: var(--lc-text-main);
            font-family: var(--font-sans);

            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
            line-height: 1.6;
        }

        .lc-wrapper {
            width: 100%;
            position: relative;
        }

        /* Hardware Acceleration Utility */
        .hw-accel {
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        /* --- 3. PREMIUM HEADER (UPSCALED) --- */
        .lc-header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5vw;
            background: linear-gradient(to bottom, rgba(2, 3, 6, 0.95) 0%, rgba(2, 3, 6, 0) 100%);
            z-index: 1000;
            transition: transform 0.4s ease;

        .lc-header.scrolled-up { transform: translateY(-100%); }

        .lc-logo {
            height: 50px;
            display: flex;
            align-items: center;
        }
        .lc-logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .lc-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--lc-text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 14px 28px;
            border: 1px solid var(--lc-border-light);
            border-radius: 100px;

        }
        .lc-back-btn:hover {
            border-color: var(--lc-accent-blue);
            background: rgba(15, 95, 255, 0.05);
            color: var(--lc-accent-blue);
            box-shadow: 0 0 20px rgba(15, 95, 255, 0.15);
        }
        .lc-back-btn svg {
            width: 16px; height: 16px;
            fill: none; stroke: currentColor; stroke-width: 2;
            transition: transform 0.3s ease;
        }
        .lc-back-btn:hover svg {
            transform: translateX(-4px);
        }

        /* --- 4. CINEMATIC HERO (POWERFUL & CRYPTO-SPECIFIC) --- */
        .lc-hero {
            position: relative;
            width: 100%;
            min-height: 85vh; /* Enough space without forcing full 100vh if content is short */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 180px 5vw 100px 5vw;
            overflow: hidden;
            border-bottom: 1px solid var(--lc-border-faint);
        }

        .lc-hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(15, 95, 255, 0.08) 0%, transparent 70%);
        }

        /* Crypto Specific Network Pattern */
        .lc-hero-network {
            position: absolute; inset: 0; z-index: 1; opacity: 0.15;

                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
            transform: perspective(1000px) rotateX(60deg) translateY(-100px) scale(2.5);
            transform-origin: top center;
        }

        /* Data Streams */
        .lc-hero-stream {
            position: absolute; top: -100%; width: 1px; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--lc-accent-blue), transparent);
            animation: dataStream 6s infinite ease-in-out;
            z-index: 1; opacity: 0.6;
        }
        .ls-1 { left: 20vw; animation-delay: 0s; }
        .ls-2 { right: 20vw; background: linear-gradient(to bottom, transparent, var(--lc-accent-cyan), transparent); animation-delay: 2.5s; animation-duration: 8s; }
        @keyframes dataStream { 0% { top: -100%; opacity: 0; } 50% { opacity: 1; } 100% { top: 200%; opacity: 0; } }

        .lc-hero-content {

            transform: translateY(40px);

            height: 10px;

            border-radius: 50%;

        }
        
        .lc-pulse::after {
            content: '';

            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px solid var(--lc-accent-cyan);

            z-index: -1;
            opacity: 0;
        }

        .lc-update-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--lc-text-dim);
            border-left: 1px solid var(--lc-border-light);
            padding-left: 40px;
        }

        .lc-timestamp {
            color: var(--lc-text-main);
            font-weight: 600;
        }

        /* --- 5. FULL-WIDTH MARKET GRID --- */
        .lc-main {
            width: 100%;
            padding: 80px 5vw 120px 5vw;
        }

        .lc-grid {

            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

            position: relative;

            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Subtle animated background glow on hover */
        .lc-card::before {
            content: ''; position: absolute; inset: 0; background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(15, 95, 255, 0.05), transparent 40%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none; z-index: 0;
        }

        .lc-card:hover {
            border-color: var(--lc-border-focus);
            transform: translateY(-4px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .lc-card:hover::before { opacity: 1; }

        /* Candlestick visual fragment */
        .lc-card-bg-graph {
            position: absolute; right: -10px; bottom: 30px; opacity: 0.05; z-index: 0;
            width: 120px; height: 60px; pointer-events: none; transition: opacity 0.4s;

        .lc-card-content {
            position: relative; z-index: 1;
        }

        .lc-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--lc-border-faint);
            padding-bottom: 15px;
        }

            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lc-asset-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--lc-bg-surface);
            border: 1px solid var(--lc-border-light);
        }

        .lc-asset-name-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .lc-asset-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--lc-text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .lc-asset-symbol {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--lc-text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .lc-card-price-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lc-price-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--lc-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .lc-price-value {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 700;
            color: var(--lc-text-main);
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s ease;
        }

        .lc-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
        }

        .lc-change-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lc-change-value {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--lc-border-faint);
        }

        .lc-change-value.positive {
            color: var(--lc-positive);
            border-color: rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.05);
        }

        .lc-change-value.negative {
            color: var(--lc-negative);
            border-color: rgba(244, 63, 94, 0.2);
            background: rgba(244, 63, 94, 0.05);
        }

        /* --- 7. PRICE UPDATE FLASH ANIMATIONS --- */
        @keyframes flashPositive {
            0% { color: var(--lc-positive); text-shadow: 0 0 20px var(--lc-positive); }
            100% { color: var(--lc-text-main); text-shadow: none; }
        }
        
        @keyframes flashNegative {
            0% { color: var(--lc-negative); text-shadow: 0 0 20px var(--lc-negative); }
            100% { color: var(--lc-text-main); text-shadow: none; }
        }

        .flash-up .lc-price-value { animation: flashPositive 2s ease-out; }
        .flash-down .lc-price-value { animation: flashNegative 2s ease-out; }

        /* --- 8. SKELETON LOADING STATE --- */
        .lc-skeleton {
            background: linear-gradient(90deg, var(--lc-bg-card) 25%, rgba(15, 95, 255, 0.1) 50%, var(--lc-bg-card) 75%);
            background-size: 400% 100%;
            animation: shimmer 2s infinite linear;
            border-radius: 4px;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sk-logo { width: 36px; height: 36px; border-radius: 50%; }
        .sk-text-1 { width: 120px; height: 18px; margin-bottom: 8px; }
        .sk-text-2 { width: 60px; height: 12px; }
        .sk-price { width: 160px; height: 32px; margin-top: 10px; }
        .sk-footer { width: 100px; height: 30px; margin-top: 10px; }

        /* --- 9. TOAST NOTIFICATIONS --- */
        .lc-toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;

        .lc-toast {
            background: rgba(10, 14, 23, 0.9);

            backdrop-filter: blur(10px);
        }

        .lc-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .lc-toast.error { border-color: var(--lc-negative); }
        .lc-toast.error::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lc-negative); box-shadow: 0 0 10px var(--lc-negative);
        }
        
        .lc-toast.success::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lc-accent-cyan); box-shadow: 0 0 10px var(--lc-accent-cyan);
        }

        /* --- 10. SCROLL TO TOP BUTTON --- */
        .lc-scroll-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid var(--lc-border-focus);
            color: var(--lc-text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);

        .lc-scroll-top.visible {

        /* --- 11. STRICT MOBILE OPTIMIZATIONS --- */
        @media (max-width: 1024px) {
            .lc-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

                    </div>
                    <div class="lc-card-content">
                        <div class="lc-skeleton sk-price"></div>
                        <div class="lc-card-footer"><div class="lc-skeleton sk-footer"></div></div>
                    </div>
                `;
                marketGrid.appendChild(skeleton);
            }
        };

        // --- Card Creation & Update ---
        const createCardHTML = (coin) => {
            const isPositive = coin.price_change_percentage_24h > 0;
            const changeClass = isPositive ? 'positive' : 'negative';
            const changeIcon = isPositive ? '▲' : '▼';
            
            // Abstract candlestick graphic for background
            const chartColor = isPositive ? 'rgba(16, 185, 129, 1)' : 'rgba(244, 63, 94, 1)';
            const bgGraph = `
                <svg class="lc-card-bg-graph" viewBox="0 0 100 50">
                    <line x1="20" y1="10" x2="20" y2="40" stroke="${chartColor}" stroke-width="2"/>
                    <rect x="15" y="20" width="10" height="15" fill="${chartColor}"/>
                    <line x1="50" y1="5" x2="50" y2="35" stroke="${chartColor}" stroke-width="2"/>
                    <rect x="45" y="10" width="10" height="20" fill="${chartColor}"/>
                    <line x1="80" y1="15" x2="80" y2="45" stroke="${chartColor}" stroke-width="2"/>
                    <rect x="75" y="25" width="10" height="15" fill="${chartColor}"/>
                </svg>
            `;

            return `
                ${bgGraph}
                <div class="lc-card-content">
                    <div class="lc-card-header">
                        <div class="lc-asset-info">
                            <img decoding="async" src="${coin.image}" alt="${coin.name} logo" class="lc-asset-logo" onerror="this.style.display='none'">
                            <div class="lc-asset-name-group">
                                <span class="lc-asset-name" title="${coin.name}">${coin.name}</span>
                                <span class="lc-asset-symbol">${coin.symbol}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="lc-card-price-section">
                        <span class="lc-price-label">Price (USD)</span>
                        <span class="lc-price-value" id="price-val-${coin.id}">${formatPrice(coin.current_price)}</span>
                    </div>
                    
                    <div class="lc-card-footer">
                        <div class="lc-change-group">
                            <span class="lc-change-value ${changeClass}" id="change-val-${coin.id}">
                                ${changeIcon} ${formatPercentage(coin.price_change_percentage_24h)}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        };

        const updateMarketGrid = (data) => {
            if (marketGrid.children.length > 0 && marketGrid.children[0].innerHTML.includes('lc-skeleton')) {
                marketGrid.innerHTML = '';
            }

            data.forEach(coin => {
                let card = document.getElementById(`card-${coin.id}`);
                
                if (!card) {
                    card = document.createElement('div');
                    card.className = 'lc-card';
                    card.id = `card-${coin.id}`;
                    card.innerHTML = createCardHTML(coin);
                    marketGrid.appendChild(card);
                    
                    // Add mouse tracking for subtle hover glow
                    card.onmousemove = e => {
                        const rect = card.getBoundingClientRect();
                        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                    };
                } else {
                    const priceEl = document.getElementById(`price-val-${coin.id}`);
                    const changeEl = document.getElementById(`change-val-${coin.id}`);
                    
                    const oldPrice = previousPrices[coin.id];
                    const newPrice = coin.current_price;
                    
                    // Flash effect if price changed
                    if (oldPrice !== undefined && oldPrice !== newPrice) {
                        const flashClass = newPrice > oldPrice ? 'flash-up' : 'flash-down';
                        card.classList.remove('flash-up', 'flash-down');
                        void card.offsetWidth; // trigger reflow
                        card.classList.add(flashClass);
                    }
                    
                    priceEl.textContent = formatPrice(newPrice);
                    
                    const isPositive = coin.price_change_percentage_24h > 0;
                    changeEl.className = `lc-change-value ${isPositive ? 'positive' : 'negative'}`;
                    changeEl.innerHTML = `${isPositive ? '▲' : '▼'} ${formatPercentage(coin.price_change_percentage_24h)}`;
                }
                previousPrices[coin.id] = coin.current_price;
            });
            
            lastUpdatedTime.textContent = `Last Data Synced: ${formatTime(new Date())}`;
        };

        // --- Data Fetching ---
        const fetchMarketData = async (isInitialLoad = false) => {
            try {
                if (isInitialLoad) renderSkeletons();
                
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                if (data && data.length > 0) {
                    updateMarketGrid(data);
                    if (!isInitialLoad) showToast('Market data synchronized successfully.', 'success');
                } else {
                    throw new Error('Empty data returned');
                }
            } catch (error) {
                console.error("Data error:", error);
                showToast('Connection delayed. Displaying most recent data.', 'error');
                if (isInitialLoad) {
                    marketGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--lc-text-muted); font-family: var(--font-mono);">Market data temporarily unavailable. Will retry automatically.</div>`;
                }
            }
        };

        // --- Initialization & Interactions ---
        const init = () => {
            fetchMarketData(true);
            setInterval(() => fetchMarketData(false), REFRESH_INTERVAL_MS);
        };

        // Scroll Handling
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const currentY = window.scrollY;
                    
                    // Header
                    if (currentY > 100) {
                        if (currentY > lastScrollY) header.classList.add('scrolled-up');
                        else header.classList.remove('scrolled-up');
                    } else {
                        header.classList.remove('scrolled-up');
                    }
                    
                    // Scroll to top
                    if (currentY > 600) scrollTopBtn.classList.add('visible');
                    else scrollTopBtn.classList.remove('visible');
                    
                    lastScrollY = currentY;
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });

        init();
        
    </script>
